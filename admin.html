<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Venance Portfolio</title>
  <link rel="icon" href="./assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Plus+Jakarta+Sans:wght@400;650;750;800&display=swap" rel="stylesheet">
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/variables.css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/layout.css">
  <link rel="stylesheet" href="./assets/css/gallery.css">
  <link rel="stylesheet" href="./assets/css/knowledge.css">
  <link rel="stylesheet" href="./assets/css/admin.css">
</head>
<body class="admin-body">
  <section class="login-screen" id="loginScreen">
    <form class="card login-card" id="loginForm">
      <span class="brand"><span class="brand-mark">VH</span><span>Administration</span></span>
      <h1 style="font-size:2.1rem">Tableau de bord</h1>
      <label class="field"><span>Mot de passe</span><input id="adminPass" type="password" autocomplete="current-password" required></label>
      <p class="login-error" id="loginError" role="alert" hidden>Mot de passe incorrect.</p>
      <button class="btn primary" type="submit">Connexion</button>
      <button class="btn" type="button" id="toggleSetupPass">Définir un mot de passe local</button>
      <div class="password-setup" id="passwordSetup" hidden>
        <label class="field"><span>Nouveau mot de passe</span><input id="newAdminPass" type="password" autocomplete="new-password"></label>
        <label class="field"><span>Confirmer</span><input id="confirmAdminPass" type="password" autocomplete="new-password"></label>
        <button class="btn primary" type="button" id="saveLocalPass">Enregistrer ce mot de passe</button>
        <p class="muted">Le mot de passe n'est pas sauvegardé en clair. Seul son hash est stocké dans ce navigateur.</p>
      </div>
      <p class="muted">Accès privé. Le mot de passe n'est jamais affiché dans l'interface.</p>
    </form>
  </section>
  <section class="admin-shell" id="adminShell" hidden>
    <aside class="sidebar">
      <span class="brand"><span class="brand-mark">VH</span><span>Portfolio CMS</span></span>
      <nav class="admin-nav">
        <button class="admin-tab active" data-tab="dashboard">Dashboard</button>
        <button class="admin-tab" data-tab="infos">Infos</button>
        <button class="admin-tab" data-tab="services">Services</button>
        <button class="admin-tab" data-tab="projects">Projets</button>
        <button class="admin-tab" data-tab="skills">Competences</button>
        <button class="admin-tab" data-tab="experience">Experiences</button>
        <button class="admin-tab" data-tab="edu">Formations</button>
        <button class="admin-tab" data-tab="certs">Certifications</button>
        <button class="admin-tab" data-tab="knowledge">Connaissances</button>
        <button class="admin-tab" data-tab="gallery">Affiches</button>
        <button class="admin-tab" data-tab="articles">Veille</button>
        <button class="admin-tab" data-tab="contacts">Contact</button>
        <button class="admin-tab" data-tab="github">GitHub</button>
      </nav>
      <div class="toolbar"><button class="btn" id="exportBtn">Export</button><label class="btn">Import<input class="sr-only" id="importInput" type="file" accept="application/json"></label><button class="btn warn" id="logoutBtn">Sortir</button></div>
    </aside>
    <main class="admin-main">
      <div class="admin-top"><div><span class="eyebrow">Gestion locale</span><h1 style="font-size:2.4rem">Dashboard</h1></div><a class="btn" href="./index.html">Voir le site</a></div>
      <div id="adminContent"></div>
    </main>
  </section>
  <div id="modalRoot"></div>
  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  <script type="module" src="./assets/js/admin.js?v=7"></script>
</body>
</html>
